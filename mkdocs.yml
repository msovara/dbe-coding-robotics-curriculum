# DBE Coding & Robotics Curriculum – static site for GitHub Pages
# Local preview: pip install -r mkdocs-requirements.txt && mkdocs serve
# Live site (after enabling Pages → GitHub Actions): https://msovara.github.io/dbe-coding-robotics-curriculum/

site_name: DBE Coding & Robotics Curriculum
site_description: Week-long teacher training workshop – South Africa DBE
site_author: DBE / CHPC integration
site_url: https://msovara.github.io/dbe-coding-robotics-curriculum/
repo_url: https://github.com/msovara/dbe-coding-robotics-curriculum
repo_name: dbe-coding-robotics-curriculum
edit_uri: edit/main/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
      base_path: ["..", ".", "docs"]
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Keep the on-page contents sidebar readable on long pages such as the
      # Day 2 facilitator memo, where every sprite has its own h4 heading.
      toc_depth: 3

